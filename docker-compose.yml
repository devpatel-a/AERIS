version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aerotwin-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - AEROTWIN_TOKEN=${AEROTWIN_TOKEN:-devtoken}
    command: ["uvicorn", "aerotwin.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: aerotwin-dashboard:latest
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
