[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerotwin"
version = "0.1.0"
description = "AI-enabled real-time digital twin for aero piston engines (Smart India Hackathon)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "pydantic>=2.4",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "python-can>=4.3",
  "cantools>=39.4",
  "filterpy>=1.4.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "shap>=0.44",
  "reportlab>=4.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["aerotwin*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
