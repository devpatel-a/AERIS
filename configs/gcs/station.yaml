# Line-of-sight C2 datalink budget (approx — replace with the fielded
# datalink's spec sheet). Link margin = received power - receiver sensitivity,
# with free-space path loss at the current slant range to the airframe.
datalink:
  frequency_mhz: 4400.0
  tx_power_dbm: 40.0
  tx_antenna_gain_dbi: 6.0
  rx_antenna_gain_dbi: 18.0
  cable_losses_db: 4.0
  rx_sensitivity_dbm: -98.0
  standoff_range_km: 45.0
  gcs_antenna_height_m: 10.0  # approx — GCS mast height; sets the LOS radio horizon   # nominal ground distance of the loiter orbit from the GCS
