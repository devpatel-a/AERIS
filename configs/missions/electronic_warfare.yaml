# 8-hour electronic-warfare support orbit with high alternator/avionics load.
mission_id: electronic_warfare
display_name: "Electronic warfare support (8h)"
short_name: "EW-8H Support"
profile: cap
sortie_prefix: "EW"
description: "Electronic Warfare Support"
engine_id: rotax914_like

environment:
  base_isa_deviation_k: 0.0
  headwind_mps: 5.0

segments:
  - name: taxi
    duration_s: 300
    target_altitude_m: 0.0
    target_airspeed_mps: 0.0
    throttle: 0.12
  - name: takeoff
    duration_s: 60
    target_altitude_m: 60.0
    target_airspeed_mps: 28.0
    throttle: 0.95
  - name: climb
    duration_s: 1200
    target_altitude_m: 4500.0
    target_airspeed_mps: 45.0
    throttle: 0.9
  - name: ew_orbit
    duration_s: 25200
    target_altitude_m: 4500.0
    target_airspeed_mps: 40.0
    throttle: 0.62
  - name: descent
    duration_s: 1200
    target_altitude_m: 200.0
    target_airspeed_mps: 35.0
    throttle: 0.28
  - name: landing
    duration_s: 300
    target_altitude_m: 0.0
    target_airspeed_mps: 0.0
    throttle: 0.15
