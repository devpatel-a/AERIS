# AeroTwin engine definition — Rotax 914-class reference.
#
# This is a representative turbocharged 4-cylinder boxer aero engine used as
# the primary reference for the digital twin. Real Rotax 914 units are
# carbureted; here we model an injected variant (per-cylinder injector flow
# coefficients + injection timing) so the twin can demonstrate the full
# required output set. All numeric values not traceable to public Rotax
# documentation are tagged `# approx — replace with OEM data`.
engine_id: rotax914_like
display_name: "Rotax 914-class turbocharged boxer (representative, injected variant)"

geometry:
  cylinders: 4
  firing_order: [1, 3, 2, 4]  # approx — replace with OEM data
  bore_m: 0.079
  stroke_m: 0.0615
  displacement_m3: 0.001211
  compression_ratio: 9.0  # approx — replace with OEM data
  layout: "boxer"

rating:
  rated_power_w: 85800.0     # ~115 hp
  rated_rpm: 5800.0
  max_rpm: 5900.0
  idle_rpm: 1400.0

turbo:
  present: true
  critical_altitude_m: 4000.0        # approx — replace with OEM data
  wastegate_max_map_kpa: 130.0       # approx — replace with OEM data
  spool_time_constant_s: 1.5         # approx — replace with OEM data
  turbo_efficiency_nominal: 0.70     # approx — replace with OEM data

cooling:
  type: "liquid_heads_air_cylinders"   # liquid-cooled heads, air-cooled cylinders
  cooling_effectiveness_nominal: 1.0
  coolant_target_k: 372.0            # ~99 C, approx — replace with OEM data
  cylinder_ambient_htc_ref: 55.0     # W/m^2K at reference airspeed, approx

fuel:
  system_type: "injection"   # representative variant; see header note
  stoich_afr: 14.7
  injector_flow_coeff_nominal: [1.0, 1.0, 1.0, 1.0]
  base_injection_advance_deg: 20.0   # approx — replace with OEM data

# Volumetric efficiency map: VE(rpm, map_kpa), bilinear-interpolated.
ve_map:
  rpm_breakpoints: [1400, 2500, 3600, 4700, 5800]
  map_breakpoints_kpa: [40, 60, 80, 100, 120]
  # approx — replace with OEM data (rows = rpm, cols = map)
  ve_table:
    - [0.55, 0.62, 0.68, 0.70, 0.70]
    - [0.62, 0.72, 0.80, 0.83, 0.84]
    - [0.66, 0.78, 0.86, 0.90, 0.91]
    - [0.64, 0.76, 0.85, 0.89, 0.90]
    - [0.60, 0.72, 0.81, 0.85, 0.86]

limits:
  max_cht_k: 508.0            # ~235 C, approx — replace with OEM data
  max_egt_k: 1173.0           # ~900 C, approx — replace with OEM data
  max_oil_temp_k: 394.0       # ~121 C, approx — replace with OEM data
  min_oil_pressure_kpa: 200.0 # approx — replace with OEM data
  max_oil_pressure_kpa: 500.0 # approx — replace with OEM data
  max_map_kpa: 135.0
  min_coolant_temp_k: 320.0
  max_coolant_temp_k: 383.0   # approx — replace with OEM data

propeller:
  diameter_m: 1.75             # approx — replace with OEM data
  load_coefficient: 0.00512    # crank-referred: torque_load = k*omega^2/gear_ratio^3, approx
  gear_ratio: 2.43
  inertia_kg_m2: 0.45          # approx — replace with OEM data

thermal_masses:
  cylinder_thermal_mass_j_per_k: 3200.0   # approx — replace with OEM data
  coolant_thermal_mass_j_per_k: 9000.0    # approx — replace with OEM data
  oil_thermal_mass_j_per_k: 6000.0        # approx — replace with OEM data
  egt_lag_time_constant_s: 0.6            # approx — replace with OEM data

lubrication:
  oil_pump_efficiency_nominal: 1.0
  oil_pressure_ref_kpa: 400.0             # approx — replace with OEM data
  oil_pressure_rpm_ref: 5000.0

electrical:
  alternator_efficiency_nominal: 0.85     # approx — replace with OEM data
  nominal_bus_voltage_v: 28.0
  battery_capacity_ah: 17.0               # approx — replace with OEM data
  base_load_a: 8.0                        # approx — replace with OEM data

vibration:
  crank_orders: [0.5, 1.0, 2.0]            # boxer 4 firing-order harmonics
  baseline_rms_g: 0.15                     # approx — replace with OEM data
  misfire_order_gain: 3.0                  # approx — replace with OEM data
  imbalance_order_gain: 2.0                # approx — replace with OEM data

friction:
  friction_factor_nominal: 1.0
  friction_torque_ref_nm: 8.0              # approx — replace with OEM data
  friction_rpm_ref: 5000.0

nominal_health:
  volumetric_efficiency_factor: 1.0
  cooling_effectiveness: 1.0
  injector_flow_coeff: [1.0, 1.0, 1.0, 1.0]
  friction_factor: 1.0
  oil_pump_efficiency: 1.0
  turbo_efficiency: 1.0
  alternator_efficiency: 1.0
